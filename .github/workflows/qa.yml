name: Portfolio Browser QA

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "package*.json"
      - "astro.config.mjs"
      - "playwright.config.js"
      - ".github/workflows/qa.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "package*.json"
      - "astro.config.mjs"
      - "playwright.config.js"
      - ".github/workflows/qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run full end-to-end suite
        run: npx playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
